services:
  whispercpp:
    image: ghcr.io/ggml-org/whisper.cpp:main
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/models:/models
    command:
      ["whisper-server --host 0.0.0.0 -m /models/ggml-tiny.en-q8_0.bin -t 4"]

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data/models:/models
    command: -m /models/qwen2.5-1.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8090 -c 2048 -t 4
